name: Test Swiggy reachability

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Swiggy mobile menu address with plain requests
        run: |
          for id in 573917 445421 622761 789131 1135469 721825 534667 640146; do
            curl -s -m 30 -o /tmp/m.json -w "id $id HTTP %{http_code} size %{size_download}\n" -A "Mozilla/5.0" "https://www.swiggy.com/mapi/menu/pl?page-type=REGULAR_MENU&complete-menu=true&lat=28.63&lng=77.21&restaurantId=$id"
            python3 -c "import json;j=json.load(open('/tmp/m.json'));print(' status',j.get('statusCode'),'cards',len(j.get('data',{}).get('cards',[])))" 2>/dev/null || echo ' not json'
            sleep 2
          done

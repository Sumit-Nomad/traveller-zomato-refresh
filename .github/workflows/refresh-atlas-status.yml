name: Refresh Atlas platform status

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-atlas-status
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Log in to Atlas and upload every outlet's platform status
        env:
          ATLAS_EMAIL: ${{ secrets.ATLAS_EMAIL }}
          ATLAS_PASSWORD: ${{ secrets.ATLAS_PASSWORD }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: python refresh_atlas_status.py
      - name: Upload diagnostic screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-login-diagnostics
          path: |
            atlas_login_stuck.png
            atlas_business_page.png
            atlas_app_picker.png
            atlas_no_token.png
          if-no-files-found: ignore
